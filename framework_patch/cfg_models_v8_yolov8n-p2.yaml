# YOLOv8 + P2 小目标检测头（本项目最终改进方案）
#
# 为什么这么改：
#   本项目数据集的目标尺寸统计显示，面积占比 <1% 的小目标占 60.1%（见 check_labels.py 输出），
#   主因是远景工人的头部只有几十个像素。原生 YOLOv8 的最小检测尺度是 P3（80×80，stride 8），
#   在这个尺度上小头部可能只剩 3~5 个像素，漏检不可避免。
#
#   本配置在 Neck 中增加一条向下延伸的分支，把 P2（160×160，stride 4）也接入检测头，
#   构成 P2/P3/P4/P5 四尺度检测。代价是浅层特征图分辨率高、计算量增加，
#   但这对"小目标占 60%"的数据是正对的收益。
#
#   与 yolov8n.yaml 的差异仅在 head：新增 16~18 三层（Upsample → Concat(backbone P2) → C2f），
#   并把 Detect 的输入从 [15,18,21] 改为 [18,21,24,27]。
#
# 层索引对照（相对原生 yolov8.yaml 的改动已标注）：
#   backbone 完全不变（0~9）
#   head 新增 P2 分支：16 Upsample / 17 Concat / 18 C2f(P2)
#   其余上采样路径的 Concat 引用顺延

# Parameters
nc: 80 # number of classes (由数据集 yaml 覆盖)
scales: # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2   (320)
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4  (160)  ← 新增检测分支用的浅层特征
  - [-1, 3, C2f, [128, True]] # 2        (160)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8  (80)
  - [-1, 6, C2f, [256, True]] # 4        (80)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16 (40)
  - [-1, 6, C2f, [512, True]] # 6        (40)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32 (20)
  - [-1, 3, C2f, [1024, True]] # 8        (20)
  - [-1, 1, SPPF, [1024, 5]] # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10  (40)
  - [[-1, 6], 1, Concat, [1]] # 11  cat backbone P4
  - [-1, 3, C2f, [512]] # 12        (40)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13  (80)
  - [[-1, 4], 1, Concat, [1]] # 14  cat backbone P3
  - [-1, 3, C2f, [256]] # 15        (80, P3)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16  (160)  ← 新增
  - [[-1, 2], 1, Concat, [1]] # 17  cat backbone P2        ← 新增
  - [-1, 3, C2f, [128]] # 18        (160, P2 小目标检测层)  ← 新增

  - [-1, 1, Conv, [128, 3, 2]] # 19  (80)   ↓ 自底向上
  - [[-1, 15], 1, Concat, [1]] # 20  cat head P3
  - [-1, 3, C2f, [256]] # 21        (80, P3)

  - [-1, 1, Conv, [256, 3, 2]] # 22  (40)
  - [[-1, 12], 1, Concat, [1]] # 23  cat head P4
  - [-1, 3, C2f, [512]] # 24        (40, P4)

  - [-1, 1, Conv, [512, 3, 2]] # 25  (20)
  - [[-1, 9], 1, Concat, [1]] # 26  cat head P5
  - [-1, 3, C2f, [1024]] # 27        (20, P5)

  - [[18, 21, 24, 27], 1, Detect, [nc]] # 28  Detect(P2, P3, P4, P5) 四尺度
