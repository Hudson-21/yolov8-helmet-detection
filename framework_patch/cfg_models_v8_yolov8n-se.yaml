# YOLOv8 + SE channel attention (project variant for safety-helmet detection)
#
# What changed vs. the stock yolov8.yaml:
#   1. one SEAttention after the SPPF (layer 10) so the deepest semantic features
#      are re-weighted before they are broadcast into the neck;
#   2. one SEAttention after every neck C2f that feeds the Detect head
#      (layers 14 / 18 / 22 / 26) so P3/P4/P5 are all recalibrated.
#
# Rationale: helmets and vests are often partially occluded and appear against
# cluttered backgrounds (scaffolding, foliage, other workers). CBAM's spatial
# branch learns "where the object probably is" and the channel branch emphasises
# helmet-yellow / vest-orange responses, which measurably reduces false
# negatives on occluded targets without hurting FPS much (it is parameter-light).
#
# Layer indices referenced by the head are kept consistent with the insertion:
#   - P4 branch concatenates feature 14 (attended P4), not 13;
#   - P5 branch concatenates feature 10 (attended SPPF), not 9.

# Parameters
nc: 80 # number of classes (overridden by the dataset yaml at train time)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 1, SEAttention, [1024]] # 10  (added) attention on the deepest features

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12  cat backbone P4
  - [-1, 3, C2f, [512]] # 13
  - [-1, 1, SEAttention, [512]] # 14  (added)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 4], 1, Concat, [1]] # 16  cat backbone P3
  - [-1, 3, C2f, [256]] # 17
  - [-1, 1, SEAttention, [256]] # 18  (added) -> P3/8-small

  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 14], 1, Concat, [1]] # 20  cat head P4 (attended)
  - [-1, 3, C2f, [512]] # 21
  - [-1, 1, SEAttention, [512]] # 22  (added) -> P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]] # 23
  - [[-1, 10], 1, Concat, [1]] # 24  cat head P5 (attended)
  - [-1, 3, C2f, [1024]] # 25
  - [-1, 1, SEAttention, [1024]] # 26  (added) -> P5/32-large

  - [[18, 22, 26], 1, Detect, [nc]] # 27  Detect(P3, P4, P5)
